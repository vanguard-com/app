name: iOS build

# Archives the Release device app without signing. This checks native code and bundled JS;
# App Store distribution still requires the owner's Apple credentials and upload validation.

on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ios-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Archive iOS Release (unsigned)
    runs-on: macos-latest
    timeout-minutes: 90
    env:
      LUMI_BUILD_PROFILE: production
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Generate native iOS project
        run: npx expo prebuild --platform ios --no-install

      - name: Xcode version
        run: xcodebuild -version

      - name: Install pods
        working-directory: ios
        run: pod install

      - name: Build
        working-directory: ios
        run: |
          set -o pipefail
          xcodebuild \
            -workspace Lumi.xcworkspace \
            -scheme Lumi \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -archivePath ../out/Lumi.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            COMPILER_INDEX_STORE_ENABLE=NO \
            archive > build.log 2>&1 || {
              grep -E "error:|BUILD FAILED" build.log | head -100
              exit 1
            }
          grep -E "ARCHIVE SUCCEEDED" build.log

      - name: Check built release app
        run: |
          python3 scripts/check-ios-release.py out/Lumi.xcarchive
          mkdir -p out/release-evidence
          cp out/Lumi.xcarchive/Products/Applications/Lumi.app/Info.plist out/release-evidence/
          cp out/Lumi.xcarchive/Products/Applications/Lumi.app/PrivacyInfo.xcprivacy out/release-evidence/
          cp ios/Podfile.lock out/release-evidence/
          cp out/ios-privacy-manifests.json out/release-evidence/
          cp ios/build.log out/release-evidence/

      - uses: actions/upload-artifact@v4
        with:
          name: ios-release-evidence
          path: out/release-evidence/
          retention-days: 14

      - name: Keep build log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ios-build-log
          path: ios/build.log
          retention-days: 7
