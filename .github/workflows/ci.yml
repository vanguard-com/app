name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Typecheck, lint, test, bundle
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Check formatting and print repair patch
        run: |
          npx prettier --write app src scripts __tests__ jest.setup.tsx package.json .github/workflows docs
          git diff

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Lint
        run: npx eslint . --max-warnings 0

      - name: Test
        run: npx jest --ci

      - name: Require committed formatting
        run: git diff --exit-code

      # Catches Metro resolution errors that tsc cannot see. No native build needed.
      - name: Bundle check (Android + iOS JS)
        run: npx expo export --platform android --platform ios --output-dir dist
